          description: Successful response
          content:
            application/json:
              schema:
                description: Response DataType
                type: array
                items:
                  type: object
                  properties:
                    isPartial:
                      description: Indicates if partial payment
                      type: boolean
                      examples:
                      - false
                    token:
                      description: Payment token used
                      type: string
                      examples:
                      - '1556778677451110'
                    accountResponseData:
                      description: Object to hold account response details
                      type: object
                      properties:
                        avs:
                          description: Address verification response
                          type: string
                          maxLength: 1
                          examples:
                          - Y
                        cvv:
                          description: CVV verification response
                          type: string
                          examples:
