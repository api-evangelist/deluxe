                                  type: string
                                  maxLength: 250
                                  examples:
                                  - 123 Main St
                                address2:
                                  description: Customer's address line 2
                                  type: string
                                  maxLength: 100
                                  examples:
                                  - Apt 5
                                postalCode:
                                  description: Customer's postal/zip code
                                  type: string
                                  maxLength: 50
                                  examples:
                                  - '94111'
                                city:
                                  description: Customer's city
                                  type: string
                                  maxLength: 50
                                  examples:
