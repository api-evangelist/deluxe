                    batchNumber:
                      description: Unique identifier to identify the batch. All the transcations with same batch number will be processed in the same batch
                      type: number
                      examples:
                      - 12345
                    amountApproved:
                      description: Approved payment amount
                      type: number
                      examples:
                      - 99.95
                    authResponse:
                      description: Authorization code from issuer
                      type: string
                      examples:
                      - ABC123
                    responseCode:
                      description: Authorizer response code
                      type: number
                      examples:
                      - 0
                    responseMessage:
                      description: Description of response code
                      type:
