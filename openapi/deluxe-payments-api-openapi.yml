  /payments/complete:
    post:
      operationId: completePayment
      summary: Complete Payment
      tags:
      - payments
      description: Use this API to finalize a previously authorized payment or to add a tip to the original transaction. This endpoint allows you to capture or complete an amount that is either equal to or less than the initially authorized amount. Partial captures are supported, enabling flexibility in payment processing. Any remaining authorized funds that are not captured will be automatically released by the bank after a specified period. This feature is particularly useful for scenarios like tip adjustments or when the final amount is determined after the initial authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request data type details for complete the payment
              type: object
              properties:
                paymentId:
                  description: Payment gateway transaction ID
                  type: string
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                  examples:
                  - d290f1ee-6c54-4b01-90e6-d701748f0851
                amount:
                  description: Amount details
                  type: object
                  properties:
                    amount:
                      description: Amount of the transaction
                      type: number
                      examples:
                      - 150
                    currency:
                      description: Currency of transaction
                      type: string
                      enum:
                      - USD
                      - CAD
                      examples:
                      - USD
                  required:
                  - amount
                tipAmount:
                  description: Object to hold the tip amount details if any
                  type: object
                  properties:
                    amount:
                      description: Amount of the transaction
                      type: number
                      examples:
                      - 150
                    currency:
                      description: Currency of transaction
                      type: string
                      enum:
                      - USD
                      - CAD
                      examples:
                      - USD
                  required:
                  - amount
              required:
              - amount
              - paymentId
            example:
              paymentId: d290f1ee-6c54-4b01-90e6-d701748f0851
              amount:
                amount: 19.99
                currency: USD
              tipAmount:
                amount: 1.99
                currency: USD
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Response data type details for complete the payment
                type: object
                properties:
                  batchNumber:
                    description: Indicated batch number in which the transaction will be settled
                    type: number
                    examples:
                    - 4321
                  amountApproved:
                    description: Approved payment amount
                    type: number
                    examples:
                    - 99.95
                  authResponse:
                    description: Authorization code from issuer
                    type: string
                    examples:
                    - ABC123
                  responseCode:
                    description: Authorizer response code
                    type: number
                    examples:
                    - 0
                  responseMessage:
                    description: Description of response code
                    type:
                    - string
                    - 'null'
                    examples:
                    - success
                  paymentId:
                    description: Payment gateway transaction ID
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
