                      type: string
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                      examples:
                      - a2406639-8692-4e1c-978d-1805eb13efdf
                  required:
                  - accountResponseData
                  - amountApproved
                  - authResponse
                  - batchNumber
                  - paymentId
                  - requestId
                  - responseCode
                  - responseMessage
              example:
              - isPartial: false
                token: '1556778677451110'
                accountResponseData:
