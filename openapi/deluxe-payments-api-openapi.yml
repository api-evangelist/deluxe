                            productData:
                              description: Object to hold a specific product data.
                              type: array
                              items:
                                description: Product data contains key details about the products or services involved in a fleet transaction. This information supports accurate billing, expense tracking, and reporting. However, product data fields do not enforce validations by themselves. Therefore, always refer to the product master data before initiating any transaction to ensure accuracy and consistency.
                                type: object
