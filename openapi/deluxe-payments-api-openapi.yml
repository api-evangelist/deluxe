                        type: string
                        minLength: 1
                        maxLength: 9
                        examples:
                        - '4354235'
                      driversLicenseNumber:
                        description: Driving Licence number of the driver captured during transaction
                        type: string
                        minLength: 1
                        maxLength: 15
                        examples:
                        - '934564354235'
                    required:
                    - driversLicenseNumber
                    - odometer
                    - sequenceNumber
                  - description: Customer data includes critical details such as odometer readings, sequence numbers, and driver license information. Capturing this data during fleet transactions ensures accuracy and accountability. It also provides valuable context on vehicle usage and driver activity, supporting improved tracking, reporting, and regulatory compliance.
                    type: array
                    items:
                      type: object
                      properties:
                        customerCode:
                          description: 'Please ensure that the correct value is provided in this field based on the intended identifier type.

                            - **DS** - Indicates `sequenceNumber`

