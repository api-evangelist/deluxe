                  pattern: ^\d{1,2}\/\d{1,2}\/\d{4}$
                  examples:
                  - 05/23/2024
                endDate:
                  description: The end date for the search
                  type: string
                  pattern: ^\d{1,2}\/\d{1,2}\/\d{4}$
                  examples:
                  - 05/25/2024
                paymentId:
