      summary: Modify Specific Customer
      tags:
      - customers
      description: The Modify Customer API allows you to update the details of an existing customer. You can modify the customer’s personal information, such as their first and last name, address, phone number, and email. This ensures that all customer records remain accurate and up-to-date.
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
        description: Path parameter customerId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Object to hold customer's information
              type: object
              properties:
                firstName:
                  description: Customer's first name
                  type: string
                  maxLength: 100
                  examples:
                  - Jane
                lastName:
                  description: Customer's last name
                  type: string
                  maxLength: 100
                  examples:
                  - Doe
                address:
                  description: Customer's address
                  type: string
                  maxLength: 250
                  examples:
                  - 123 Main St
                address2:
                  description: Customer's address line 2
                  type: string
                  maxLength: 100
                  examples:
                  - Apt 5
                postalCode:
                  description: Customer's postal/zip code
                  type: string
                  maxLength: 10
                  examples:
                  - '94111'
                city:
                  description: Customer's city
                  type: string
                  maxLength: 50
                  examples:
                  - San Francisco
                state:
                  description: Customer's state/province
                  type: string
                  maxLength: 25
                  examples:
                  - CA
                country:
                  description: Customer's country
                  type: string
                  maxLength: 25
                  examples:
                  - USA
                phone:
                  description: Customer's phone number
                  type: string
                  pattern: ^(\+\d{1,3}[\s-]?)?\(?\d{3}\)?[\s-]?\d{3}[\s-]?\d{4}$
                  maxLength: 17
                  examples:
                  - +1-212-456-7890
                email:
                  description: Customer's email address
                  type: string
                  maxLength: 250
                  examples:
                  - john@email.com
                companyName:
                  type: string
                  maxLength: 75
                  examples:
                  - Deluxe Corp
              required:
              - firstName
            example:
              firstName: Jane
              lastName: Doe
              address: 123 Main St
              address2: 123 Main St
              city: San Francisco
              state: CA
              country: USA
              postalCode: '94111'
              email: john@email.com
              companyName: Deluxe Corp
              phone: +1-212-456-7890
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Response parameters for the API
                type: object
                properties:
                  customerId:
                    description: Unique identifier for a customer
                    type: number
                    examples:
                    - 4321
                  requestId:
                    description: Unique identifier for an API call
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - a2406639-8692-4e1c-978d-1805eb13efdf
