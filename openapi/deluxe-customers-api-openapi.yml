    delete:
      operationId: deleteSpecificCustomer
      summary: Delete Specific Customer
      tags:
      - customers
      description: 'Deletes the customer identified by the given customer ID and permanently removes all associated records, including personal details,contact information,email,payment methods and subscriptions.

        >**Note:**

        > - The customer will be permanently removed from the Vault.

        > - All upcoming payments will be cancelled.

        > - All associated transactions will no longer be linked to the customer.

        > - Perform an impact or dependency check before deletion using the endpoint:"https://api.deluxe.com/dpp/v1/customers/{customerId}"'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
        description: Path parameter customerId.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Response details
                type: object
                properties:
                  customerId:
                    type: number
                    examples:
                    - 4321
                  responseMessage:
                    description: Description of response code
                    type:
                    - string
                    - 'null'
                    examples:
                    - Customer deleted successfully
                  requestId:
                    description: Unique identifier for an API call
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - a2406639-8692-4e1c-978d-1805eb13efdf
                required:
                - customerId
                - requestId
                - responseMessage
              example:
                customerId: 12345
                responseMessage: Customer deleted successfully
                requestId: a2406639-8692-4e1c-978d-1805eb13efdf
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization server.'
        '403':
