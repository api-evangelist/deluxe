  /events/performTest:
    post:
      operationId: performTestEvent
      summary: Perform Test Event
      tags:
      - events
      description: This API endpoint allows you to test the webhook endpoint. This endpoint posts a sample/test data as payload based on the webhook type to the URL provided in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  description: Type of webhook event to subscribe
                  type: string
                  maxLength: 50
                  examples:
                  - Transaction
                testEndPoint:
                  description: Test end point to receive on the listening/target URL
                  type: string
                  pattern: ^https:\/\/([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/[a-zA-Z0-9\-_]+)*(\/)?
                  maxLength: 500
                  examples:
                  - https://webhook.site/acc3f0bb-27d9-4a19-98ec-33af9c56741b
              required:
              - eventType
              - testEndPoint
            example:
              eventType: Transaction
              testEndPoint: https://webhook.site/acc3f0bb-27d9-4a19-98ec-33af9c56741b
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    description: response of webhook event to subscribe
                    type: string
                    examples:
                    - This URL has no default content configured. <a href="https://webhook.site/#!/view/625063d2-fc62-4a3e-8033-8f5c60b7f566">View in Webhook.site</a>.
                  statusCode:
                    description: statusCode to receive on the listening/target URL
                    type: number
                    examples:
                    - 200
                required:
                - response
                - statusCode
              example:
                response: This URL has no default content configured. <a href="https://webhook.site/#!/view/625063d2-fc62-4a3e-8033-8f5c60b7f566">View in Webhook.site</a>.
                statusCode: 200
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization server.'
        '403':
          description: 'Forbidden: invalid client application credentials.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'This API supports OpenID Connect OAuth 2.0 for authenticating all API requests.

        Bearer tokens are obtained from the Deluxe security service token endpoint using client credentials and expire after 60 minutes.'
    basicAuth:
      type: http
      scheme: basic
      description: This API supports Anypoint's Client ID Enforcement authentication policy.
