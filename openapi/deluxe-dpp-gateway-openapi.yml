  /refunds:
    post:
      operationId: createRefund
      summary: Create Refund
      tags:
      - refunds
      description: Processes refunds through a single endpoint supporting multiple use cases. For standard refunds, provide
        the paymentId and refund amount. For standalone refunds, specify the refund amount and payment method details, such
        as card information (cardNumber, expirationDate, CVV) or ACH/Credit details (accountNumber, routingNumber, accountType).
        For vault refunds, use the paymentMethodId of a stored payment method along with the refund amount. This endpoint
        ensures flexibility and secure handling of all refund scenarios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'Refund endpoint supports 3 request types such as Refund, Credit, and Standalone Refund

                - **Refund**: Initiates a full or partial refund for an original transaction that has already settled.

                - **Credit**: Initiates a new credit(refund) transaction by providing ACH details.

                - **Standalone Refund**: Initiates a new refund transaction by providing payment method details such as Card
                or paymentMethodId.'
              oneOf:
              - description: Object represents the details for transaction reversal and includes the original payment ID,
                  the amount to be refunded, and associated order details such as the order ID. It is used to process partial
                  or full refunds against completed payments for specific orders.
                type: object
                properties:
                  paymentId:
                    description: Payment gateway transaction ID
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - d290f1ee-6c54-4b01-90e6-d701748f0851
                  isACH:
                    description: Flag to indicate whether the original sale or debit transaction was processed via ACH.
                    type: boolean
                    examples:
                    - false
                  amount:
                    description: Object to hold amount details
                    type: object
                    properties:
                      amount:
                        description: Amount of the transaction
                        type: number
                        examples:
                        - 150
                      currency:
                        description: Currency of transaction
                        type: string
                        enum:
                        - USD
                        - CAD
                        examples:
                        - USD
                    required:
                    - amount
                  orderData:
                    description: Object to hold order details
                    type: object
                    properties:
                      autoGenerateOrderId:
                        description: Flag to tell if Order Id is to be automatically generated
                        type: boolean
                        examples:
                        - true
                      orderId:
                        description: Unique identifier of Order
                        type: string
                        examples:
                        - abc12345
                      orderIdIsUnique:
                        description: Flag to tell if Order Id is unique
                        type: boolean
                        examples:
                        - true
                    required:
                    - orderId
                required:
                - amount
                - paymentId
              - description: Object to hold the details to initiates a refund directly to ACH payment method without referencing
                  a prior payment. It includes the refund amount, payment method details.
                type: object
                properties:
                  amount:
                    description: Object to hold amount details such as amount value and currency
                    type: object
                    properties:
                      amount:
                        description: Amount of the transaction
                        type: number
                        examples:
                        - 150
                      currency:
                        description: Currency of transaction
                        type: string
                        enum:
                        - USD
                        - CAD
                        examples:
                        - USD
                    required:
                    - amount
                  paymentMethod:
                    description: Object to hold the details of ACH payment method.
                    type: object
                    properties:
                      ach:
                        description: Object to hold ACH information such as bank account number, routing number, and account
                          type (e.g., Checking or Savings). Includes optional billing address to support verification and
                          regulatory compliance. Enables secure account-based transactions for direct debit payments.
                        type: object
                        properties:
                          accountNumber:
                            description: Bank account number
                            type: string
                            minLength: 1
                            maxLength: 20
                            examples:
                            - '987654321'
                          routingNumber:
                            description: Bank Routing Number
                            type: string
                            minLength: 8
                            maxLength: 9
                            examples:
                            - '123456789'
                          accountType:
                            description: Account Type - Checking/Savings
                            type: string
                            enum:
                            - Checking
                            - Savings
                            examples:
                            - Checking
                        required:
                        - accountNumber
                        - routingNumber
                      billingAddress:
                        description: Billing Address details includes name, street address, city, postal code, country, and
                          optional contact information like phone and email. These fields support payment verification, fraud
                          prevention, and customer record enrichment, making it easier to integrate with billing, invoicing,
                          compliance systems.
                        type: object
                        properties:
                          firstName:
                            description: Customer's first name
                            type: string
                            maxLength: 100
                            examples:
                            - Jane
                          lastName:
                            description: Customer's last name
                            type: string
                            maxLength: 100
                            examples:
                            - Doe
                          address:
                            description: Customer's address
                            type: string
                            maxLength: 250
                            examples:
                            - 123 Main St
                          address2:
                            description: Customer's address line 2
                            type: string
                            maxLength: 100
                            examples:
                            - Apt 5
                          postalCode:
                            description: Customer's postal/zip code
                            type: string
                            maxLength: 50
                            examples:
                            - '94111'
                          city:
                            description: Customer's city
                            type: string
                            maxLength: 50
                            examples:
                            - San Francisco
                          state:
                            description: Customer's state/province
                            type: string
                            maxLength: 25
                            examples:
                            - CA
                          country:
                            description: Customer's country
                            type: string
                            maxLength: 25
                            examples:
                            - USA
                          phone:
                            description: Customer's phone number
                            type: string
                            pattern: ^(\+\d{1,3}[\s-]?)?\(?\d{3}\)?[\s-]?\d{3}[\s-]?\d{4}$
                            maxLength: 17
                            examples:
