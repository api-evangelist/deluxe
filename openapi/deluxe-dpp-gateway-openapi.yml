  /payments/batch:
    post:
      operationId: createBatchPayments
      summary: Create Batch Payments
      tags:
      - payments
      description: The Create Batch Payments end point allows you to send multiple transctions in a single API call and process
        all of them in single batch in a given date. This feature is useful for processing multiple payment transactions in
        one batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request DataType
              type: object
              properties:
                startDate:
                  description: Date at which the batch processing should start for processing.
                  type: string
                  pattern: ^(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{4}$
                  examples:
                  - 09/25/2023
                transactions:
                  description: Array to hold transaction details to process in this batch request.
                  type: array
                  items:
                    type: object
                    properties:
                      paymentType:
                        description: Identifies if the payment method is Debit for ACH Payments, or Sale for Card payment.
                        type: string
                        enum:
                        - Sale
                        - Debit
                        examples:
                        - Sale
                      amount:
                        description: Object to hold amount details
                        type: object
                        properties:
                          amount:
                            description: Amount of the transaction
                            type: number
                            examples:
                            - 150
                          currency:
                            description: Currency of transaction
                            type: string
                            enum:
                            - USD
                            - CAD
                            examples:
                            - USD
                        required:
                        - amount
                      paymentMethod:
                        description: Object to hold payment method details
                        oneOf:
                        - description: Object to hold card details such as card number, expiration date, and CVV. Includes
                            billing address for verification purposes. Supports secure, PCI-compliant card-based transactions
                            while reducing exposure of sensitive payment data across digital checkout and payment authorization
                            flows.
                          type: object
                          properties:
                            card:
                              description: Object to hold card details such as card number, expiration date, and CVV. Includes
                                billing address for verification purposes. Supports secure, PCI-compliant card-based transactions
                                while reducing exposure of sensitive payment data across digital checkout and payment authorization
                                flows.
                              type: object
                              properties:
                                card:
                                  description: Card Number
                                  type: string
                                  minLength: 12
                                  maxLength: 19
                                  examples:
                                  - '4111111111111110'
                                expiry:
                                  description: Card Expiration Month and Year
                                  type: string
                                  pattern: ^(0[1-9]|1[0-2])\/\d{2}$
                                  examples:
                                  - 11/26
                                cvv:
                                  description: Card CVV/Security Code
                                  type: string
                                  minLength: 3
                                  maxLength: 4
                                  examples:
                                  - '245'
                              required:
                              - card
                              - expiry
                            billingAddress:
                              description: Billing Address details includes name, street address, city, postal code, country,
                                and optional contact information like phone and email. These fields support payment verification,
                                fraud prevention, and customer record enrichment, making it easier to integrate with billing,
                                invoicing, compliance systems.
                              type: object
