                            level2:
                              description: Level 2 data enhances payment transactions by including customer reference numbers,
                                local tax indicators, tax amounts, shipping ZIP codes, and purchase card flags. The Search
                                Payment endpoint returns this enriched information to provide better context for each transaction,
                                improving financial reporting accuracy, simplifying reconciliation, and strengthening compliance
                                and audit readiness.
