                      avsDate:
                        description: Date that verify address ran on specific payment method
                        type: string
                        examples:
                        - '2021-11-26T00:00:00'
                  cardType:
                    description: Specifies the type of card being used for the transaction (e.g., credit, debit, prepaid).
                    type: string
                    examples:
                    - Visa
                  maskedPan:
                    description: Masked Primary Account Number (PAN) used for display and logging. Only the last few digits
                      are visible for security purposes.
                    type: string
                    examples:
                    - 4111********4321
                  expiry:
                    description: Card expiration date (in MMYY format).
                    type: string
                    examples:
                    - 11/25
                  token:
                    description: Used for processing transactions without exposing the actual PAN.
                    type: string
                    maxLength: 16
                    examples:
                    - '8791230000000000'
                  accountNumber:
                    description: The full Primary Account Number (PAN) associated with the card.
                    type: string
