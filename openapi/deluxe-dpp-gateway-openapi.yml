  /paymentmethods/verification/ach:
    post:
      operationId: verifyAch
      summary: Verify ACH
      tags:
      - paymentmethods
      description: Initiates an ACH Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request details used for ACH verification.
              type: object
              properties:
                paymentMethod:
                  description: Payment method details used to get avs.
                  type: object
                  properties:
                    ach:
                      description: Card details used to get avs.
                      type: object
                      properties:
                        accountNumber:
                          description: Bank account number
                          type: string
                          minLength: 1
                          maxLength: 20
                          examples:
                          - '987654321'
                        routingNumber:
                          description: Bank Routing Number
                          type: string
                          minLength: 8
                          maxLength: 9
                          examples:
                          - '123456789'
                      required:
                      - accountNumber
                      - routingNumber
                    currency:
                      description: Currency
                      type: string
                      enum:
                      - USD
                      - CAD
                      examples:
                      - USD
            example:
              paymentMethod:
                ach:
                  routingNumber: '123456789'
                  accountNumber: '987654321'
                currency: USD
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Object to hold avs response details.
                type: object
                properties:
                  status:
                    description: ACH Verification status
                    type: string
                    enum:
                    - INVALID
                    - VALID
                    - BLOCKED
                  isValidRoutingNumber:
                    description: Boolean flag that specifies if the routing number is valid.
                    type: boolean
                    examples:
                    - true
                  responseMessage:
                    description: Description of response code
                    type: string
                    examples:
                    - Success
                  requestId:
                    description: Unique identifier for an API call
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - a2406639-8692-4e1c-978d-1805eb13efdf
                required:
                - isValidRoutingNumber
                - requestId
                - responseMessage
                - status
              example:
                status: INVALID
                isValidRoutingNumber: true
                responseMessage: Success
                requestId: a2406639-8692-4e1c-978d-1805eb13efdf
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization
            server.'
        '403':
          description: 'Forbidden: invalid client application credentials.'
  /paymentmethods/surcharge:
    post:
      operationId: checkSurcharge
      summary: Check Surcharge
      tags:
      - paymentmethods
      description: This API endpoint allows you to verify the surcharge associated to merchant for the given payment methods
        such as card, token, vault and cryptogram. The input requires a payment method and optional amount and currency and
        you will get surcharge rate/percentage and surcharge amount in response. This will help merchants to check the applicable
        surcharge rate before actual transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request details to get Surcharge
              type: object
              properties:
                paymentMethod:
                  description: Object to hold the payment method details that are using to get Surcharge
                  oneOf:
                  - description: Object to hold card details
                    type: object
                    properties:
                      card:
                        description: Card object containing card number
                        type: object
                        properties:
                          card:
                            description: Card Number
                            type: string
                            minLength: 12
                            maxLength: 19
                            examples:
                            - '4111111111111110'
                        required:
                        - card
                  - type: object
                    properties:
                      token:
                        type: object
                        properties:
                          token:
                            description: Tokenized string for Card details
                            type: string
                            maxLength: 20
                            examples:
                            - '1234567890123450'
                        required:
                        - token
                    additionalProperties: false
                  - type: object
                    properties:
                      vault:
                        type: object
                        properties:
                          paymentMethodId:
                            description: Unique identifier for stored payment method
                            type: string
                            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                            examples:
                            - 99c33585-a62f-45bb-a733-5720dd69ab1e
                        required:
                        - paymentMethodId
                    additionalProperties: false
                  - type: object
                    properties:
                      cryptogram:
                        type: object
                        properties:
                          cryptogram:
                            description: Tokenized string that passes Card or Bank details
                            type: string
                            examples:
                            - 6cd3ef836ce141b789b5755ca3f353f1
                        required:
                        - cryptogram
                    additionalProperties: false
                amount:
                  description: Object to hold the amount details
                  type: object
                  properties:
                    amount:
                      description: Amount of the transaction
                      type: number
                      examples:
                      - 150
                    currency:
                      description: Currency of transaction
                      type: string
                      enum:
                      - USD
                      - CAD
                      examples:
                      - USD
                  required:
                  - amount
              required:
              - paymentMethod
            example:
              paymentMethod:
                card:
                  card: '4141414141414141'
              amount:
                amount: 10
                currency: USD
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  surchargeRate:
                    description: Applicable rate or percentage of the surcharge for a given payment method
                    type: number
                    examples:
                    - 3
                  surchargeAmount:
                    description: Applicable amount of the surcharge for a given payment method
                    type: number
                    examples:
                    - 0.3
                  cardType:
                    description: Type of the card that surcharge is retriving. i.e DEBIT or CREDIT
                    type: string
                    examples:
                    - Card
                  isSurchargeEnabled:
                    description: Flag to tell if the surcharge is enabled or not
                    type: boolean
                    examples:
                    - true
                  requestId:
                    description: Unique identifier for an API call
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - a2406639-8692-4e1c-978d-1805eb13efdf
                required:
                - cardType
                - isSurchargeEnabled
                - requestId
                - surchargeRate
              example:
                surchargeRate: 3
                surchargeAmount: 0.3
                cardType: CREDIT
                isSurchargeEnabled: true
                requestId: fe4e03ad-b047-4bbd-a7ba-b8a136785b58
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization
            server.'
        '403':
          description: 'Forbidden: invalid client application credentials.'
  /paymentmethods/binlookup:
    get:
      operationId: binLookup
      summary: BIN Lookup
      tags:
      - paymentmethods
      description: Verify BIN lookup retrieves details by passing the first 6 to 8 digits of the card number. It returns information
        such as whether the cardholder is eligible for Level 2 or Level 3 surcharges, the card type, brand, and country.
      parameters:
      - name: partnerToken
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
          - 80ae9a4a-5efd-412e-89b9-532f2ab2f817
        description: Unique Merchant Identifier for API Calls
        example: 80ae9a4a-5efd-412e-89b9-532f2ab2f817
      - name: requestId
        in: header
        required: false
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
          - 56ae9a4a-5efd-412e-89b9-532f2ab2f275
        description: 'Unique request identifier in GUID format included in the header, used to trace and correlate API calls
          across systems.

          > **Note:** We strongly recommend including the `requestId` header in every API request. This unique GUID helps
          trace and correlate API calls across systems, ensuring better observability and troubleshooting.'
        example: 56ae9a4a-5efd-412e-89b9-532f2ab2f275
      - name: bin
        in: query
        required: true
        schema:
          type: string
          minLength: 6
          maxLength: 8
          examples:
          - '411111'
        description: BIN used to retrieve details.
        example: '411111'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  bin:
                    description: BIN used to retrieve card details.
                    type: string
                    examples:
                    - '411111'
                  cardType:
                    description: Indicates the type of card associated with the provided BIN (Bank Identification Number),
                      such as CREDIT,DEBIT.
                    type: string
                    enum:
                    - CREDIT
                    - DEBIT
                    examples:
                    - CREDIT
                  brand:
                    description: The brand of the card.
                    type: string
                    examples:
                    - VISA
                  country:
                    description: Full country name where the card was issued.
                    type: object
                    properties:
                      name:
                        description: Full country name where the card was issued.
                        type: string
                        examples:
                        - UNITED STATES
                      abbreviation:
                        description: ISO or short-form code of the country.
                        type: string
                        examples:
                        - USA
                    required:
                    - abbreviation
                    - name
                  prepaid:
                    description: Indicates whether the card is a prepaid card.
                    type: boolean
                    examples:
                    - false
                  qualifications:
                    description: Indicates whether the BIN qualifies for Level 2 or Level 3 processing along with surcharge
                      eligibility details.
                    type: object
                    properties:
                      level2:
                        description: Indicates if the card qualifies for Level 2 processing.
                        type: boolean
                        examples:
                        - true
                      level3:
                        description: Indicates if the card qualifies for Level 3 processing.
                        type: boolean
                        examples:
                        - true
                      surcharge:
                        description: Indicates whether a surcharge can be applied to the card.
                        type: boolean
                        examples:
                        - false
                    required:
                    - level2
                    - level3
                    - surcharge
                required:
                - bin
                - brand
                - cardType
                - country
                - prepaid
                - qualifications
              example:
                bin: '411111'
                cardType: CREDIT
                brand: VISA
                prepaid: false
                country:
                  name: UNITED STATES
                  abbreviation: USA
                qualifications:
                  level2: true
                  level3: true
                  surcharge: false
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization
            server.'
        '403':
          description: 'Forbidden: invalid client application credentials.'
