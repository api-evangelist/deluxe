                    type: string
                    examples:
                    - '2021-11-26T00:00:00'
                  vaultUpdated:
                    description: The date and time when the vault record was last updated.
                    type: string
                    examples:
                    - '2021-11-26T00:00:00'
                  vaultExpires:
                    description: The date on which the vault record is scheduled to expire.
                    type: string
                    examples:
                    - '2021-11-26T00:00:00'
                  isActive:
                    description: Indicates whether the vault record is currently active.
                    type: boolean
                    examples:
                    - true
                  paymentMethodId:
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - d10f860c-ab05-4002-86b3-b4a707d9a999
                  accountResponseData:
                    description: Object to hold account verification responses such as AVS (Address Verification Service)
                      and CVV check results. These fields indicate the outcome of address and card security code validations,
                      typically returned by the payment processor.
                    type: object
                    properties:
                      avs:
                        description: Address verification response
                        type: string
                        maxLength: 1
                        examples:
