                  properties:
                    customerRefNumber:
                      description: Reference number for customer
                      type: string
                      examples:
                      - '7898654'
                    localTaxFlag:
                      description: "Indicator, if local taxes apply.\n> Note: On `localTaxFlag` behavior, user can send the\
                        \ acceptable values 1 and 2.\n- If `taxAmount = 0.00`, set **`localTaxFlag = 2`**, which indicates\
                        \ it is an tax exempted item.  \n- If `taxAmount > 0.00`, set **`localTaxFlag = 1`**."
                      type: integer
                      examples:
                      - 1
                    purchaseCard:
                      description: Indicates if purchase card
                      type: boolean
                      examples:
                      - false
                    shippingZip:
                      description: Zip/Postal code of the shipping address
                      type: string
                      examples:
                      - '94002'
                    taxAmount:
                      description: Total Tax Amount is the sum of all individual tax amounts applied to each sale item in
                        a transaction. It represents the overall tax charged on the entire purchase.
                      type: number
                      examples:
                      - 2
                level3:
                  description: 'Level 3 data provides detailed line-item information for each sale item in a transaction,
                    including descriptions, quantities, pricing, and discounts. This level of detail enhances transparency,
                    improves financial reporting and reconciliation, and supports compliance with procurement policies. It
                    also enables more efficient processing for corporate and government transactions, often resulting in lower
                    interchange fees and stronger vendor relationships.


                    Recommendations for Level 3 Transactions:

                    - Use a Level 3-enabled card and provide detailed line-item data.

                    - Ensure a non-zero tax amount is included for Level 2 and Level 3 transactions.'
                  type: array
                  items:
                    description: 'Level 3 data provides detailed line-item information for each sale item in a transaction,
                      including descriptions, quantities, pricing, and discounts. This level of detail enhances transparency,
                      improves financial reporting and reconciliation, and supports compliance with procurement policies.
                      It also enables more efficient processing for corporate and government transactions, often resulting
                      in lower interchange fees and stronger vendor relationships.


                      Recommendations for Level 3 Transactions:

                      - Use a Level 3-enabled card and provide detailed line-item data.

                      - Ensure a non-zero tax amount is included for Level 2 and Level 3 transactions.'
                    type: object
                    properties:
                      description:
                        description: Description or name of the sale item
                        type: string
                        maxLength: 250
                        examples:
                        - Apple
                      skuCode:
                        description: Stock Keeping Unit Code
                        type: string
                        maxLength: 100
                        examples:
                        - SKU1234
                      unitCost:
                        description: The cost per single unit of the item being purchased.
                        type: number
                        examples:
                        - 5
                      price:
                        description: Represents the total price of the item sold.
                        type: number
                        examples:
                        - 5
                      quantity:
                        description: Quantity of item sold
                        type: number
                        examples:
                        - 4
                      commodityCode:
                        description: Code used to classify the type of goods or services involved in transaction. DPP APIs
                          do not enforce validations for commodity codes. It is recommended to use standardized lists by referring
                          the [link](https://www.mpiprocessing.com/level-3-and-level-2-credit-card-processing-commodity-codes/)
                        type: string
                        maxLength: 12
                        examples:
                        - '39028'
                      unitOfMeasure:
                        description: Unit of measuring the item. The API do not enforce validations for units of measure,
                          it is recommended to use standardized lists by referring the [link](https://help.usaepay.info/developer/reference/umcodes/)
                        type: string
                        maxLength: 50
                        examples:
                        - Dozen
                      freightAmount:
                        description: The cost of shipping or transportation for the item.
                        type: number
                        examples:
                        - 0
                      dutyAmount:
                        description: The cost of customs duties or import taxes (especially for international purchases).
                        type: number
                        examples:
                        - 0
                      itemDiscountAmount:
                        description: Discount amount applied on sale item
                        type: number
                        examples:
                        - 0
                      itemDiscountRate:
                        description: Discount rate of the sale item
                        type: number
                        examples:
                        - 0
                      taxAmount:
                        description: Tax amount applied on the sale item.
                        type: number
                        examples:
                        - 2
                customData:
                  description: Custom data allows integrators to pass additional, customizable information related to a transaction
                    when it does not fit into any predefined fields. This feature supports sending data as name–value pairs
                    (e.g., Invoice Number and its corresponding value).
                  type: array
                  items:
                    description: Custom data allows integrators to pass additional, customizable information related to a
                      transaction when it does not fit into any predefined fields. This feature supports sending data as name–value
                      pairs (e.g., Invoice Number and its corresponding value).
                    type: object
                    properties:
                      name:
                        description: Custom Data field name or key
                        type: string
                        examples:
                        - Invoice Number
                      value:
                        description: Custom Data field value
                        type: string
                        examples:
                        - inv1234
                merchantCategory:
                  description: Industry in which merchant operates
                  type: string
                  maxLength: 100
                  examples:
                  - E-Commerce
                paymentCompleteDate:
                  description: Date on which payment has to be captured/completed. Format MM/dd/yyyy
                  type: string
                  examples:
                  - 09/25/2023
                orderData:
                  description: Object to hold order details
                  type: object
                  properties:
                    autoGenerateOrderId:
                      description: Flag to tell if Order Id is to be automatically generated
                      type: boolean
                      examples:
                      - true
                    orderId:
                      description: Unique identifier of Order
                      type: string
                      examples:
                      - abc12345
                    orderIdIsUnique:
                      description: Flag to tell if Order Id is unique
                      type: boolean
                      examples:
                      - true
                alternateFee:
                  description: Object to hold additional fee passed by integrator
                  type: object
                  properties:
                    feeType:
                      description: Alternate fee description
                      type: string
                      examples:
                      - Surcharge
                    feePercent:
                      description: Percentage of surcharge to be charged
                      type: number
                      examples:
                      - 3
                    amount:
                      description: Amount of surcharge calculated based on
                      type: number
                      examples:
                      - 4.5
                    waived:
                      description: Flag to tell if the fee is to be waived or not
                      type: boolean
                      examples:
                      - true
                    addedToTotalAmount:
                      description: Flag to tell if the fee is to be added to the total amount
                      type: boolean
                      examples:
                      - true
                productData:
                  description: Product data contains key details about the products or services involved in a fleet transaction.
                    This information supports accurate billing, expense tracking, and reporting. However, product data fields
                    do not enforce validations by themselves. Therefore, always refer to the product master data before initiating
                    any transaction to ensure accuracy and consistency.
                  type: array
                  items:
                    description: Product data contains key details about the products or services involved in a fleet transaction.
                      This information supports accurate billing, expense tracking, and reporting. However, product data fields
                      do not enforce validations by themselves. Therefore, always refer to the product master data before
                      initiating any transaction to ensure accuracy and consistency.
                    type: object
                    properties:
                      productCode:
                        description: Unique code used to identify the product.
                        type: string
                        maxLength: 50
                        examples:
                        - '036'
                      serviceCode:
                        description: Code that represents the service associated with the product.
                        type: string
                        maxLength: 50
                        examples:
                        - S
                      unitMeasurement:
                        description: The unit in which the product is measured.
                        type: string
                        maxLength: 50
                        examples:
                        - K
                      unitQuantity:
                        description: The number of smaller units contained within the product.
                        type: number
                        examples:
                        - 2
                      unitPrice:
                        description: The price per single unit of the product.
                        type: number
                        examples:
                        - 3
                      price:
                        description: The total value of the single product.
                        type: number
                        examples:
                        - 6
                      quantity:
                        description: The total number of products.
                        type: number
                        examples:
                        - 5
                      cost:
                        description: The cost for the product.
                        type: number
                        examples:
                        - 30
                    required:
                    - cost
                    - price
                    - productCode
                    - quantity
                    - serviceCode
                    - unitMeasurement
                    - unitPrice
                    - unitQuantity
                customerData:
                  description: Customer data includes critical details such as odometer readings, sequence numbers, and driver
                    license information. Capturing this data during fleet transactions ensures accuracy and accountability.
                    It also provides valuable context on vehicle usage and driver activity, supporting improved tracking,
                    reporting, and regulatory compliance.
                  type: object
                  properties:
                    sequenceNumber:
