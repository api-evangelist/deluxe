        online payments. It allows the specification of payment details, customer information, order data, itemized purchases,
        and additional custom data. The generated payment link can be configured with various options like payment method
        acceptance, billing, and contact requirements. The link can be sent to the customer via email and includes a personalized
        confirmation message. Upon successful creation, the API returns a unique payment link ID, the URL for the payment
        link, and a payment ID for tracking.
