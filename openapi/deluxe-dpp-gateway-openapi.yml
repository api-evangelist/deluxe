      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Object to hold the subscription response
                type: object
                properties:
                  isPartial:
                    description: Indicates if partial payment
                    type: boolean
                    examples:
                    - false
                  orderId:
                    description: Merchant order ID
                    type: string
                    examples:
                    - Order123
                  customerId:
                    description: Unique identifier for a customer
                    type: number
                    examples:
                    - 4321
                  batchNumber:
                    description: Indicated batch number in which the transaction will be settled
                    type: number
                    examples:
                    - 1234
                  subscriptionId:
                    description: Unique identifier for a recurring payment
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - 9a2cb7fe-119c-48ef-973e-8299246df7c2
                  paymentMethodId:
                    description: Unique identifier for a payment method (ACH or Card)
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - d10f860c-ab05-4002-86b3-b4a707d9a999
                  fee:
                    description: Object to hold fee details
                    type: object
                    properties:
                      feeAmount:
                        description: Amount of fee applied
                        type: number
                        examples:
                        - 1.99
                      feeAuthResponse:
                        description: Authorizer's response code for fee payment
                        type:
                        - string
                        - 'null'
                        examples:
                        - '441248'
                    required:
                    - feeAmount
                    - feeAuthResponse
                  token:
                    description: Payment token used
                    type: string
                    examples:
                    - '1556778677451110'
                  accountResponseData:
                    description: Object to hold account response details
                    type: object
                    properties:
                      avs:
                        description: Address verification response
                        type: string
                        maxLength: 1
                        examples:
                        - Y
                      cvv:
                        description: CVV verification response
                        type: string
                        examples:
                        - Y
                    required:
                    - avs
                    - cvv
                  amountApproved:
                    description: Approved payment amount
                    type: number
                    examples:
                    - 99.95
                  authResponse:
                    description: Authorization code from issuer
                    type: string
                    examples:
                    - ABC123
                  responseCode:
                    description: Authorizer response code
                    type: number
                    examples:
                    - 0
                  responseMessage:
                    description: Description of response code
                    type:
                    - string
                    - 'null'
                    examples:
                    - success
                  paymentId:
                    description: Payment gateway transaction ID
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - d290f1ee-6c54-4b01-90e6-d701748f0851
                  requestId:
                    description: Unique identifier for an API call
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - a2406639-8692-4e1c-978d-1805eb13efdf
                required:
                - accountResponseData
                - amountApproved
                - authResponse
                - batchNumber
                - customerId
                - fee
                - isPartial
                - orderId
                - paymentId
                - paymentMethodId
                - requestId
                - responseMessage
                - subscriptionId
                - token
              example:
                isPartial: false
                orderId: Order123
                customerId: 7896
                batchNumber: 1234
                subscriptionId: 9a2cb7fe-119c-48ef-973e-8299246df7c2
                paymentMethodId: d10f860c-ab05-4002-86b3-b4a707d9a999
                fee:
                  feeAuthResponse: ''
                  feeAmount: 1.99
                token: '1556778677451110'
                accountResponseData:
                  avs: Y
                  cvv: Y
                amountApproved: 99.95
                authResponse: ABC123
                responseCode: 0
                responseMessage: null
                paymentId: d290f1ee-6c54-4b01-90e6-d701748f0851
                requestId: a2406639-8692-4e1c-978d-1805eb13efdf
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization
            server.'
        '403':
          description: 'Forbidden: invalid client application credentials.'
  /subscriptions/{subscriptionId}:
    patch:
      operationId: modifySubscription
      summary: Modify Subscription
      tags:
      - subscriptions
      description: This API endpoint modifies an existing subscription identified by the subscriptionId passed in the URL.
        You must provide the customer’s ID, the payment method ID, and updated subscription details including frequency, paymentDay,
        startDate, endDate, paymentMonth, amount, and active. Upon successful modification, the subscription is updated accordingly,
        and a confirmation with the updated details is returned.
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
        description: Path parameter subscriptionId.
      - name: partnerToken
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
          - 80ae9a4a-5efd-412e-89b9-532f2ab2f817
        description: Unique Merchant Identifier for API Calls
        example: 80ae9a4a-5efd-412e-89b9-532f2ab2f817
      - name: requestId
        in: header
        required: false
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
          - 56ae9a4a-5efd-412e-89b9-532f2ab2f275
        description: 'Unique request identifier in GUID format included in the header, used to trace and correlate API calls
          across systems.

          > **Note:** We strongly recommend including the `requestId` header in every API request. This unique GUID helps
          trace and correlate API calls across systems, ensuring better observability and troubleshooting.'
        example: 56ae9a4a-5efd-412e-89b9-532f2ab2f275
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request DataType
              type: object
              properties:
                customer:
                  description: Object to hold customer details
                  type: object
                  properties:
                    customerId:
                      description: Unique identifier for a customer
                      type: number
                      examples:
                      - 5687
                  required:
                  - customerId
                paymentMethod:
                  description: Object to hold payment details
                  type: object
                  properties:
                    paymentMethodId:
                      description: Unique identifier for a payment method (ACH or Card)
                      type: string
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                      examples:
                      - d10f860c-ab05-4002-86b3-b4a707d9a999
                  required:
                  - paymentMethodId
                subscription:
                  description: Subscription details
                  type: object
                  properties:
                    startDate:
                      description: Specifies the starting date from which recurring billing begins. The startDate must either
                        match the subscription transaction date or be set to a future date.
                      type: string
                      examples:
                      - 10/25/2023
                    endDate:
                      description: Defines the termination date of the subscription period.
                      type: string
                      examples:
                      - 10/25/2025
                    frequency:
                      description: Indicates how often billing occurs e.g., Monthly, Quarterly, or Annually
                      type: string
                      enum:
                      - Daily
                      - Weekly
                      - BiWeekly
                      - TriWeekly
                      - Monthly
                      - BiMonthly
                      - Quarterly
                      - Annually
                      - Custom
                      - SemiAnnually
                      examples:
                      - Monthly
                    active:
                      description: Boolean flag to reflect whether the subscription is currently active or not
                      type: boolean
                      default: true
                      examples:
                      - true
                    paymentDay:
                      description: Specifies the designated day of the week (e.g., Sunday) when payment is scheduled to process;
                        useful for weekly plans.
                      type: string
                      enum:
                      - Monday
                      - Tuesday
                      - Wednesday
                      - Thursday
                      - Friday
                      - Saturday
                      - Sunday
                      examples:
                      - Sunday
                    paymentMonth:
                      description: Defines the month (1 to 12) when payment is intended to occur, relevant for annual billing
                        cycles.
                      type: integer
                      minimum: 1
                      maximum: 12
                      examples:
                      - 10
                    custom:
                      description: Object to hold the custom subscription details.
                      type: object
                      properties:
                        interval:
                          description: Specifies the frequency of the billing cycle based on the defined interval type.
                          type: number
                          minimum: 1
                          examples:
                          - 5
                        intervalType:
                          description: Defines the unit of time used for the billing interval (for example, daily, weekly,
                            monthly, or yearly).
                          type: string
                          enum:
                          - DAY
                          - WEEK
                          - MONTH
                          - YEAR
                          examples:
                          - DAY
                        duration:
                          description: 'Specifies how long the subscription will continue.

                            - **FIXED_PAYMENTS:** Runs for a limited number of payments.

                            - **UNTIL_END_DATE:** The subscription continues indefinitely until end date.

                            - **UNTIL_CANCELLED:** The subscription continues indefinitely until manually cancelled.'
                          type: string
                          enum:
                          - UNTIL_CANCELLED
                          - UNTIL_END_DATE
                          - FIXED_PAYMENTS
                          examples:
                          - FIXED_PAYMENTS
                        numberOfPayments:
                          description: Specifies the total number of billing cycles for the subscription. This field is required
                            when duration is set to FIXED and is ignored when duration is UNTIL_CANCELLED.
                          type: number
                          minimum: 1
                          examples:
                          - 5
                    amount:
                      description: Amount of the subscription
                      type: number
                      examples:
                      - 19.99
                  required:
                  - amount
                  - endDate
                  - frequency
                  - startDate
            example:
              customer:
                customerId: 5687
              paymentMethod:
                paymentMethodId: d10f860c-ab05-4002-86b3-b4a707d9a999
              subscription:
                amount: 19.99
                startDate: 10/25/2023
                endDate: 10/25/2025
                frequency: Monthly
                active: true
                paymentDay: Sunday
                paymentMonth: 10
                custom:
                  interval: 1
                  intervalType: MONTH
                  duration: UNTIL_CANCELLED
                  numberOfPayments: 5
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Subscription response.
                type: object
                properties:
                  subscriptionId:
                    description: Unique identifier for a recurring payment
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - 9a2cb7fe-119c-48ef-973e-8299246df7c2
                  authResponse:
                    description: Authorization code from issuer
                    type: string
                    examples:
                    - ABC123
                  responseCode:
                    description: Authorizer response code
                    type: number
                    examples:
                    - 0
                  responseMessage:
                    description: Description of response code
                    type:
                    - string
                    - 'null'
                    examples:
                    - null
                  requestId:
                    description: Unique identifier for an API call
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - a2406639-8692-4e1c-978d-1805eb13efdf
                  paymentMethodId:
                    description: Unique identifier for a payment method (ACH or Card)
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - d290f1ee-6c54-4b01-90e6-d701748f0851
                  customerId:
                    description: Unique identifier for a customer
                    type: number
                    examples:
                    - 5678
                required:
                - authResponse
                - customerId
                - paymentMethodId
                - requestId
                - responseCode
                - responseMessage
                - subscriptionId
              example:
                subscriptionId: 9a2cb7fe-119c-48ef-973e-8299246df7c2
                authResponse: ABC123
                responseCode: 0
                responseMessage: null
                requestId: a2406639-8692-4e1c-978d-1805eb13efdf
                paymentMethodId: d290f1ee-6c54-4b01-90e6-d701748f0851
                customerId: 5678
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization
            server.'
        '403':
          description: 'Forbidden: invalid client application credentials.'
  /paymentmethods:
    post:
      operationId: createPaymentMethod
      summary: Create Payment Method
      tags:
      - paymentmethods
      description: This API endpoint allows you to create a new payment method for a customer. You need to provide details
        including a nickname for the payment method, its active status, ACH information (such as account number and routing
        number), and the billing address. Additionally, you must specify the customer ID associated with the payment method.
        The API will store these details securely for future transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request DataType
              type: object
              properties:
                customerId:
                  description: Unique identifier for a customer
                  type: number
                  examples:
                  - 4321
                paymentMethod:
