  /emv/payment:
    post:
      operationId: emvPayments
      summary: EMV Payments
      tags:
      - emv
      description: 'Initiates a sale or authorization on a physical EMV device by sending the ``deviceId``, ``amount``, and
        a ``callbackUrl``. The terminal processes the transaction and returns a simple in‑API response, while the detailed
        transaction result is delivered to the callback URL. Use this endpoint for chip‑based, card‑present transactions on
        supported devices.


        Begin your integration with the Overview and Get Started pages under **API Reference > EMV Payments**, accessible
        through the main menu via **Payments › Merchant Services**. Use these endpoint details when implementing specific
        calls.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request to hold EMV based transaction attributes.
              type: object
              properties:
                transactionType:
                  description: Identifies if the transaction type is of SALE/AUTHORIZE.
                  type: string
                  enum:
                  - SALE
                  - AUTHORIZE
                  examples:
                  - SALE
                deviceId:
                  description: Unique identifier of the EMV payment device.
                  type: string
                  minLength: 1
                  maxLength: 50
                  examples:
                  - '10'
                callbackUrl:
                  description: Webhook URL to get the updated response details, if any.
                  type: string
                  minLength: 5
                  maxLength: 100
                  examples:
                  - https://webhook.site/63b65a42-6012-49ea-b98f-d01d46283018
                amount:
                  description: Sale amount of the transaction done through cloud EMV device payment method
                  type: object
                  properties:
                    amount:
                      description: Amount of the transaction
                      type: number
                      minimum: 0.01
                      examples:
                      - 19.99
                    currency:
                      description: Type of currency in which transaction is done.
                      type: string
                      enum:
                      - USD
                      examples:
                      - USD
                  required:
                  - amount
              required:
              - callbackUrl
              - deviceId
              - transactionType
            example:
              transactionType: SALE
              deviceId: '2'
              callbackUrl: https://webhook.site/63b65a42-6012-49ea-b98f-d01d46283018
              amount:
                amount: 19.99
                currency: USD
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Response DataType
                type: object
                properties:
                  paymentId:
                    description: Unique identifier for the payment done.
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - 63748a11-312d-456e-b55d-2008f8deea90
                  requestId:
                    description: Unique identifier for the API request.
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - bb75b884-e7a7-4510-aabc-3fdade625654
                  responseMessage:
                    description: Response message
                    type: string
                    examples:
                    - Sale completed successfully.
              example:
                paymentId: 63748a11-312d-456e-b55d-2008f8deea90
                requestId: bb75b884-e7a7-4510-aabc-3fdade625654
                responseMessage: Your transaction is currently being processed. For more details, please check the callback
                  URL in sometime.
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization
            server.'
        '403':
          description: 'Forbidden: invalid client application credentials.'
