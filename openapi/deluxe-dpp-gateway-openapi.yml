                      - '56432'
                    odometer:
                      description: Odometer reading of the vehicle captured during transaction
                      type: string
                      minLength: 1
                      maxLength: 9
                      examples:
                      - '4354235'
                    driversLicenseNumber:
                      description: Driving Licence number of the driver captured during transaction
                      type: string
                      minLength: 1
                      maxLength: 15
                      examples:
                      - '934564354235'
                  required:
                  - driversLicenseNumber
                  - odometer
                  - sequenceNumber
                deviceId:
                  description: Fleet data capturing deviceId
                  type: string
                  maxLength: 50
                  examples:
                  - '1'
              required:
              - amount
              - paymentMethod
              - paymentType
              - subscription
            example:
              paymentType: Sale
              amount:
                amount: 99.99
                currency: USD
              paymentMethod:
                card:
                  card: '4111111111111110'
                  expiry: 11/26
                  cvv: '245'
                billingAddress:
                  firstName: Jane
                  lastName: Doe
                  address: 123 Main St
                  address2: Apt 5
                  postalCode: '94111'
