  /payments/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel Payment
      tags:
      - payments
      description: Use this API to cancel a payment that is still in process and has not yet been settled. This endpoint is
        typically used to void transactions on the same day they are initiated, before the batch closure occurs. By utilizing
        this API, you can halt a payment before it enters the settlement phase, effectively preventing the transfer of funds.
        This is particularly useful in scenarios where a payment needs to be stopped due to errors, cancellations, or changes
        in the transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentId:
                  description: Payment gateway transaction ID
                  type: string
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                  examples:
                  - d290f1ee-6c54-4b01-90e6-d701748f0851
                isACH:
                  description: Flag to indicate whether the original sale or debit transaction was processed via ACH.
                  type: boolean
                  examples:
                  - false
              required:
              - paymentId
            example:
              paymentId: d290f1ee-6c54-4b01-90e6-d701748f0851
              isACH: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  authResponse:
                    description: Authorization code from issuer
                    type: string
                    examples:
                    - ABC123
                  batchNumber:
                    description: Indicated batch number in which the transaction will be settled
                    type: number
                    examples:
                    - 1234
                  responseCode:
                    description: Authorizer response code
                    type: number
                    examples:
                    - 0
                  responseMessage:
                    description: Description of any code returned
                    type:
                    - string
                    - 'null'
                    examples:
                    - success
                  paymentId:
                    description: Payment gateway transaction ID
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - d290f1ee-6c54-4b01-90e6-d701748f0851
                  requestId:
                    description: Unique identifier for an API call
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - a2406639-8692-4e1c-978d-1805eb13efdf
                required:
                - authResponse
                - batchNumber
                - paymentId
                - requestId
                - responseCode
                - responseMessage
              example:
                authResponse: ABC123
                batchNumber: 1234
                responseCode: 0
                responseMessage: null
                paymentId: d290f1ee-6c54-4b01-90e6-d701748f0851
                requestId: a2406639-8692-4e1c-978d-1805eb13efdf
        '401':
          description: 'Unauthorized: invalid token, expired token, or connection error when connecting to the authorization
            server.'
        '403':
          description: 'Forbidden: invalid client application credentials.'
  /payments/authorize:
    post:
      operationId: authorizePayment
      summary: Authorize Payment
      tags:
      - payments
      description: Submits a payment authorization request to reserve the specified amount on the customer's payment method.
        This authorization process ensures that the funds are available but does not complete the transaction until a capture
        is performed. The endpoint supports authorizations using a direct card, a tokenized payment method, or a card stored
        in a secure vault. This process is crucial for scenarios where the payment needs to be confirmed or adjusted before
        finalizing the charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request object to hold details for payment authorization, including payment method, billing and
                shipping addresses, and tax details. It supports Level 2 and Level 3 processing for sale items and fleet products,
                and also includes optional customer data, order information, and alternate fees.
              type: object
              properties:
                amount:
                  description: Object to hold the total transaction amount and currency. Make sure the amount matches the
                    sum of sale items or products in Level 3 transactions, and includes any applicable fees.
                  type: object
                  properties:
                    amount:
                      description: Amount of the transaction
                      type: number
                      examples:
                      - 150
                    currency:
                      description: Currency of transaction
                      type: string
                      enum:
                      - USD
                      - CAD
                      examples:
                      - USD
                  required:
                  - amount
                paymentMethod:
                  description: Payment method details
                  oneOf:
                  - description: Object to hold card details such as card number, expiration date, and CVV. Includes billing
                      address for verification purposes. Supports secure, PCI-compliant card-based transactions while reducing
                      exposure of sensitive payment data across digital checkout and payment authorization flows.
                    type: object
                    properties:
                      card:
                        description: Object to hold card details such as card number, expiration date, and CVV. Includes billing
                          address for verification purposes. Supports secure, PCI-compliant card-based transactions while
                          reducing exposure of sensitive payment data across digital checkout and payment authorization flows.
                        type: object
                        properties:
                          card:
                            description: Card Number
                            type: string
                            minLength: 12
                            maxLength: 19
                            examples:
                            - '4111111111111110'
                          expiry:
                            description: Card Expiration Month and Year
                            type: string
                            pattern: ^(0[1-9]|1[0-2])\/\d{2}$
                            examples:
                            - 11/26
                          cvv:
                            description: Card CVV/Security Code
                            type: string
                            minLength: 3
                            maxLength: 4
                            examples:
                            - '245'
                        required:
                        - card
                        - expiry
                      billingAddress:
                        description: Billing Address details includes name, street address, city, postal code, country, and
                          optional contact information like phone and email. These fields support payment verification, fraud
                          prevention, and customer record enrichment, making it easier to integrate with billing, invoicing,
                          compliance systems.
                        type: object
                        properties:
                          firstName:
                            description: Customer's first name
                            type: string
                            maxLength: 100
                            examples:
                            - Jane
                          lastName:
                            description: Customer's last name
                            type: string
                            maxLength: 100
                            examples:
                            - Doe
                          address:
                            description: Customer's address
                            type: string
                            maxLength: 250
                            examples:
                            - 123 Main St
                          address2:
                            description: Customer's address line 2
                            type: string
                            maxLength: 100
                            examples:
                            - Apt 5
                          postalCode:
                            description: Customer's postal/zip code
                            type: string
                            maxLength: 50
                            examples:
                            - '94111'
                          city:
                            description: Customer's city
                            type: string
