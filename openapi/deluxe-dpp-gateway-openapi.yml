                            level3:
                              description: 'Level 3 data provides detailed information about each item within a transaction,
                                such as descriptions, quantities, pricing, and discounts. By including this granular data
                                in search payments, businesses gain greater transparency into what was purchased—not just
                                the total amount spent. This enhanced visibility improves financial reporting, streamlines
                                reconciliation, and supports compliance with procurement policies. Additionally, it enables
                                more efficient processing of corporate and government transactions, often resulting in lower
                                interchange fees and stronger vendor relationships.


                                Recommendations for Level 3 Transactions:

                                - Use an L3-enabled card and provide supplemental data, including Quick Items

                                - Ensure a non-zero tax is included for Level 2/Level 3 transactions'
