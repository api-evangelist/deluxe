  /payments/search:
    post:
      operationId: searchPayments
      summary: Search Payments
      tags:
      - payments
      description: This API endpoint is used to search and retrieve a list of payments, providing details about each payment
        for a given data range. The response indicates whether the search was successful or if there were errors or validation
        issues.
