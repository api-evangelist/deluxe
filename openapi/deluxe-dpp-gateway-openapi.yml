                    minLength: 1
                    maxLength: 250
                    examples:
                    - Online
                  terminalAccessKey:
                    description: Authentication credential used to authorize communication between an EMV terminal and the
                      EMV Device Cloud.
                    type: string
                    examples:
                    - 204f3b9dde011ede53664c089fa30b88
                  terminalConnectionId:
                    description: The unique identifier of the terminal connection associated with an EMV device.
