        card details and billing address), and subscription details (such as start and end dates, frequency, and payment schedule).
        Additionally, you can specify shipping address, tax information, itemized details (Level 2 and Level 3 data), custom
        data, merchant category, and any alternate fees. Upon successful subscription creation, a unique subscription identifier
        and order details will be generated, and the subscription will be scheduled according to the provided parameters.
