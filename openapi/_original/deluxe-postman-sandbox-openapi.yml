openapi: 3.0.0
info:
  title: Deluxe Postman-Sandbox
  version: '1'
servers:
  - url: 'https://sandbox.api.deluxe.com'
components:
  securitySchemes:
    oauth2Auth:
      type: http
      scheme: basic
security:
  - oauth2Auth: []
paths:
  /secservices/oauth2/v2/token:
    post:
      summary: BearerToken
      parameters:
        - schema:
            type: string
            example: application/x-www-form-urlencoded
            default: application/x-www-form-urlencoded
          in: header
          name: Content-Type
          required: true
        - schema:
            type: string
            example: Basic REDACTED_CLIENT_ID_COLON_SECRET_BASE64
          in: header
          name: Authorization
          example: 'Basic {Base64Encoded}'
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    access_token: eyJraWQiOiJKNGRWRlUtSkNrUGpFdEN2aFpwdE0ybHNHVW9yNUUyQmE2QXFYdk1NcVZjIiwiYWxnIjoiUlMyNTYifQ..gEd9-RrQCcFnx8j1RK7py86MSEgzplZlvDEcN7_w6sxFes1-ON9bX1nMHq7tmcktAEl0R1SgHV1ly387mnIEQ5LnrKjcLyaJkjyWVAdXwPhKvyLK9M15el7sX64PHxtBLScG3_l96X4kk5Oo29dmosGs1Heodqzmtvi20Id-H12Zcyg4ZopjVgCwqA_BPWz19Rvgr0MjUTeXsUoX00WyY_WHbrjVG16tOLugAAr4JfW1ML1xkFeCNAmkwDm67DC2I9yEF8KIakMtanxTBE5kDBB20G9Vwx3Sinv7wAW602IDH_wgfun4sPnoa2Fdk0PJJLfYvuKkjOUO4XKq6KPe7A
                    tokenExpiry_time: '2023-02-14T04:29:29Z'
                    expires_in: '3600'
                properties:
                  access_token:
                    type: string
                    description: This is the value that will be used with the required "Bearer" authorization header for making API calls to all Deluxe API endpoints.
                  tokenExpiry_time:
                    type: string
                    description: This is the date and time the "access_token" received will expire. This will need to be converted to your local date time.
                  expires_in:
                    type: string
                    description: The amount of time in seconds the token will expire
                required:
                  - access_token
                  - tokenExpiry_time
                  - expires_in
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  default: client_credentials
                  description: Grant type being requested
                scope:
                  type: string
                  default: mulesoft_scope
                  description: Scope for which the token is being request
              required:
                - grant_type
                - scope
          application/xml:
            schema:
              type: object
              properties: {}
          multipart/form-data:
            schema:
              type: object
              properties: {}
          text/html:
            schema:
              type: object
              properties: {}
          text/plain:
            schema:
              type: object
              properties: {}
          application/EDI-X12:
            schema:
              type: object
              properties: {}
          application/EDIFACT:
            schema:
              type: object
              properties: {}
          application/atom+xml:
            schema:
              type: object
              properties: {}
          application/font-woff:
            schema:
              type: object
              properties: {}
          application/gzip:
            schema:
              type: object
              properties: {}
          application/javascript:
            schema:
              type: object
              properties: {}
          application/octet-stream:
            schema:
              type: object
              properties: {}
          application/ogg:
            schema:
              type: object
              properties: {}
          application/pdf:
            schema:
              type: object
              properties: {}
          application/postscript:
            schema:
              type: object
              properties: {}
          application/soap+xml:
            schema:
              type: object
              properties: {}
          application/x-bittorrent:
            schema:
              type: object
              properties: {}
          application/x-tex:
            schema:
              type: object
              properties: {}
          application/xhtml+xml:
            schema:
              type: object
              properties: {}
          application/xml-dtd:
            schema:
              type: object
              properties: {}
          application/xop+xml:
            schema:
              type: object
              properties: {}
          application/zip:
            schema:
              type: object
              properties: {}
        description: ''
      description: Use this call to authenticate and receive a bearer token. Bearer token is valid for 59 minutes only and required on all API calls.
  /american/v1/family/transactions:
    post:
      summary: Transaction Processing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RequestId:
                  type: string
                  format: uuid
                  description: Identifier used by the caller to identify the request. Returned in response
                versionNum:
                  type: integer
                  default: 1
                  description: Reserved for future use
                webhookInfo:
                  type: string
                  description: Reserved for future use
                RequestType:
                  type: string
                  default: Sale
                  example: Sale
                  description: 'Sale,Authorize,Close Batch,Credit,Debit,Generate Token,Refund,Settle,Standalone Refund,Tip Adjust,Void'
                TransactionSource:
                  type: string
                  description: Source of the initial request
                  default: Deluxe API
                IpAddress:
                  type: string
                  description: Reserved for future use
                Amount:
                  type: object
                  description: 'Required for : Sale,Refund,TipAdjust,Debit(ACH),Credit(ACH)'
                  properties:
                    Amount:
                      type: integer
                      description: Amount of the transaction
                    Currency:
                      type: string
                      example: 'USD,CDN'
                      description: 'Currency, generally merchant specific'
                PaymentMethod:
                  description: 'Required for : Sale,.Authorization,Debit(ACH),Credit(ACH). PaymentMethod''s can only contain one form of payment (CreditCard,ACH,Token,Vault,Cryptogram)'
                  oneOf:
                    - properties:
                        CreditCard:
                          type: object
                          description: Cardholder creditcard information
                          properties:
                            ccNumber:
                              type: string
                            expMonthYear:
                              type: string
                            cvv:
                              type: string
                        BillingAddress:
                          type: object
                          description: Cardholder billing information (Can be used with all available PaymentMethods)
                          properties:
                            FirstName:
                              type: string
                            LastName:
                              type: string
                            Address:
                              type: string
                            Address2:
                              type: string
                            City:
                              type: string
                            State:
                              type: string
                            PostalCode:
                              type: string
                            Country:
                              type: string
                            Telephone:
                              type: string
                            EmailAddress:
                              type: string
                        AchInfo:
                          type: object
                          description: Cardholder ACH information
                          properties:
                            RoutingNumber:
                              type: string
                            AccountNumber:
                              type: string
                            AccountType:
                              type: string
                              example: 'C,S'
                            AchCategory:
                              type: string
                        Cryptogram:
                          type: string
                          description: Cryptogram sting can be used in place of Creditcard and ACH info when required.
                        VaultId:
                          type: string
                          description: VaultID that corresponds to cardholder data
                        VaultKey:
                          type: string
                          description: Reserved for future use (Required if using Vault as PaymentMethod).
                        CVV2:
                          type: string
                          description: CVV data (Required when using Vault or Token as PaymentMethod)
                        Token:
                          type: string
                          description: Token that corresponds to cardholder data previously stored.
                        ExpMonthYear:
                          type: string
                          description: Expiration month and year for token (Required if Token used in PamentMethod)
                  type: object
                TipAmount:
                  type: object
                  description: Required when submitting TipAdjust request type
                  properties:
                    Amount:
                      type: integer
                      example: 14
                    Currency:
                      type: string
                TransactionId:
                  type: string
                  format: uuid
                  description: 'This should be the TransactionId returned in the initial transaction request. Required for Refund,Void,Tip Adjust'
                ReccuringData:
                  type: object
                  description: Used to setup a recurring payment. Amount and PaymentMethod objects are required when setting up a recurring payment.
                  properties:
                    RecurringType:
                      type: string
                      example: Daily
                      description: 'Daily, Weekly, Biweekly, Monthly, Quarterly, Semiannually, Annually, Bimonthly, Triweekly'
                    RecurringStartDate:
                      type: string
                      format: date
                      description: Date the recurring payment will start
                    RecurringEndDate:
                      type: string
                      format: date
                      description: Date the recurring payment will end
                    RecurringScheduleDayDetail:
                      type: string
                      x-stoplight:
                        id: atektphqtgn5e
                      description: Indicates the day of week to process recurring transaction (Used only with Weekly/Monthly/Annual)
                    RecurringScheduleMonth:
                      type: integer
                      x-stoplight:
                        id: yg5ct810ildmn
                      description: Indicates the month to process the recurring transaction (Used only with Annually)
              required:
                - RequestId
                - versionNum
                - RequestType
                - TransactionSource
        description: ''
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: bearer aeb8907d-bf84-462a-afe0-ae996dda3ab9
          required: true
          description: This is the API authorization and is required on all API calls
        - name: ApplicationId
          in: header
          schema:
            type: string
            example: B5sz2SL6RhwJGUvZAKn7S7SeJQbvAckU
          example: 7775AD1E-AA25-4ED3-812F-21C966D97C26
          description: 'Reserved for future use, please use the default value'
          required: true
        - name: AccessToken
          in: header
          schema:
            type: string
          example: 7775AD1E-AA25-4ED3-812F-21C966D97C26
          required: true
          description: This is your merchant specific identifier when making API calls to the transaction processing endpoint.
      responses:
        '200':
          description: OK
          headers:
            Date:
              schema:
                type: string
                example: 'Tue, 10 May 2022 16:47:34 GMT'
            Content-Type:
              schema:
                type: string
                example: application/json; charset=UTF-8
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    IsPartial: false
                    OrderId: '521818404607950883'
                    CustomerToken: null
                    RecurringId: null
                    Fee: null
                    Token: '1556778677451111'
                    TransactionRecordID: 61863
                    AmountApproved: 1
                    AuthResponse: '009129'
                    RequestId: 6a45c9cf-30a1-4850-850b-ca73f9dddeae
                    ErrorCode: 0
                    Errors: null
                    TransactionId: 6279f114-aeff-4e78-9bba-ec3bee044a03
                properties:
                  IsPartial:
                    type: boolean
                    description: Indicates if this was a partial payment
                  OrderId:
                    type: string
                    description: OrderId that was sent with the request
                  RecurringId:
                    type: string
                    description: RecurringId if recurring was setup at time of processing
                    nullable: true
                  AmountApproved:
                    type: integer
                    description: Amount approved by the appropriate card vendor
                  AuthResponse:
                    type: string
                    description: Authorization code
                  RequestId:
                    type: string
                    description: RequestID sent with initial request
                  ErrorCode:
                    type: integer
                    description: 'Indicates if the transaction was successful 0 = success, 1 = Decline/Error'
                  Errors:
                    type: array
                    description: List of errors encountered during processing
                    nullable: true
                    items: {}
                  TransactionId:
                    type: string
                    description: Transaction identifier
              example:
                IsPartial: false
                OrderId: '12345'
                AmountApproved: 10
                AuthResponse: '012345'
                RequestId: a85a8e6b-348b-4011-a1ec-1e78e9620788
                ErrorCode: 0
                TransactionId: 9d5a3e8b-2396-422f-a0a0-c8d187db0f23
  /american/v1/family/reports:
    post:
      summary: Report Processing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  RequestId: '{{$guid}}'
                  VersionNum: 1
                  WebhookInfo: n/a
                  RequestType: Custom Report
                  TransactionSource: Deluxe API
                  ReportTitle: Journal - CC  - Approval Current Month
                  StartDate: 02/01/2023
                  EndDate: 02/01/2023
                  Page: 1
                  PageSize: 2
              properties:
                RequestId:
                  type: string
                  description: Identifier used by the caller to identify the request. Returned in response
                VersionNum:
                  type: integer
                  description: Reserved for future use
                WebhookInfo:
                  type: string
                  description: Reserved for future use
                RequestType:
                  type: string
                  description: Custom Report
                TransactionSource:
                  type: string
                  description: Source of the initial request
                ReportTitle:
                  type: string
                  description: Name of the report being run
                StartDate:
                  type: string
                  description: Start date for report request
                EndDate:
                  type: string
                  description: End date for report request
                Page:
                  type: integer
                  description: Used for report pagination if number of records return in result needs to be controlled.
                PageSize:
                  type: integer
                  description: Used for report pagination if number of records return in result needs to be controlled.
              required:
                - RequestId
                - VersionNum
                - WebhookInfo
                - RequestType
                - TransactionSource
                - ReportTitle
                - StartDate
                - EndDate
        description: ''
      parameters:
        - schema:
            type: string
          in: header
          name: Authorization
          description: This is the API authorization and is required on all API calls
          required: true
        - schema:
            type: string
          in: header
          name: ApplicationId
          description: Reserved for future use
          required: true
        - schema:
            type: string
          in: header
          name: AccessToken
          description: This is your merchant specific identifier when making API calls to the transaction processing endpoint.
          required: true
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    ErrorCode: 0
