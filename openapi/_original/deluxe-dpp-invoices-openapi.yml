                    - price
                    - quantity
                  minItems: 1
                total:
                  description: Object to hold the total amount related fields such as discountRate and currency.
                  type: object
                  properties:
                    discountRate:
                      description: Discount rate/percentage applied on the invoice total amount. The invoice amount will be
