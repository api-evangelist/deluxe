                fax: +44-208-1234567
                email: sampath@cmail.com
                website: www.deluxbill.com
              shippingAddress:
                firstName: Bob
                lastName: murphy
                address: 588 Delaware Avenue
                address2: Houston
                city: Bris
                state: CA
                country: US
                postalCode: '94005'
                phone: +1 123-456-7890
                fax: +44-208-1234567
                email: bobmurphy@cmail.com
                website: www.deluxship.com
                shippingMethod: Courier
              saleItems:
              - detailId: 1
                name: Product one
                price: '12.50'
                quantity: 100
              - detailId: 2
                name: Product two
                price: '3.99'
                quantity: 52
              total:
                discountRate: '2.50'
                currency: USD
              paymentTerms:
                dueDays: 1
              customData:
              - name: Invoice Number
                value: inv1234
              - name: Custom Name
                value: Custome Value
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Object to hold the modified invoice response details such as invoiceId and success response message.
                type: object
                properties:
                  invoiceId:
                    description: Unique identifier for the invoice.
                    type: integer
                    examples:
                    - 54321
                  requestId:
                    description: Unique identifier for the successful API call.
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    examples:
                    - a2406639-8692-4e1c-978d-1805eb13efdf
                  responseMessage:
                    description: Response message after modifying an existing draft invoice.
                    type: string
                    examples:
                    - Invoice is updated successfully.
                required:
                - invoiceId
                - requestId
                - responseMessage
              example:
                invoiceId: 14843
                responseMessage: Invoice updated successfully.
                requestId: a2406639-8692-4e1c-978d-1805eb13efdf
