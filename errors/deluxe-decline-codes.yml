note: Deluxe publishes a single flat table of 57 gateway/issuer response codes for the Deluxe Payments Platform.
  The codes are returned INSIDE a 200 response envelope, in the numeric `responseCode` field (0 = approved) with
  a human string in `responseMessage` — they are not HTTP status codes and there is no RFC 9457 problem+json body.
  33 of the 57 codes carry the identical masked message 'REQUEST DECLINED!', so the issuer's real reason is deliberately
  withheld from the integrator; the remaining 24 name a specific condition. Remediation text in `action` is API
  Evangelist guidance derived from the published meaning, not Deluxe copy.
