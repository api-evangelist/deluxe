description: >-
  Deluxe publishes NO plans, NO price points and NO rate card for the Deluxe Payments Platform APIs or
  for Deluxe Merchant Services. Every route to the API terminates in a human: the developer guide says
  "Email our team at isvinquiries@deluxe.com to request API credentials and access", and the Get Started
  page offers only a web form, a sales email (DLXmerchserv@deluxe.com) and a sales phone number
  ((877) 523-1099). There is no self-serve signup, no free tier, no trial and no published transaction
  fee. This is a verified zero, not a missing measurement.
