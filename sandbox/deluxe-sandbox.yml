provider: Deluxe Corporation
providerId: deluxe
api: Deluxe Payments Platform (DPP)
available: true
self_serve: false
note: >-
  Deluxe publishes a real sandbox with published test cards and test bank details, but sandbox access is
  NOT self-serve: a Client ID and Client Secret must be requested from the Deluxe integrations team by
  email (isvinquiries@deluxe.com) before any call can be made. Every value below is quoted verbatim from
  Deluxe's own test-data page; none of it was invented.
environments:
  - name: sandbox
    host: https://sandbox.api.deluxe.com
    token_endpoint: https://sandbox.api.deluxe.com/secservices/oauth2/v2/token
    base_path: /dpp/v1
    test_merchant_id: '6280780007735798'
    test_merchant_label: IATS DPP TEST
    hosted_payment_form_script: https://hostedform2.deluxe.com/iframeLoader.js
    embedded_payments_script: https://payments2.deluxe.com/embedded/javascripts/deluxe.js
  - name: production
    host: https://api.deluxe.com
    base_path: /dpp/v1
    alternate_base_path: /dpp/v1/gateway
    hosted_payment_form_script: https://hostedpaymentform.deluxe.com/iframeLoader.js
    embedded_payments_script: https://payments.deluxe.com/embedded/javascripts/deluxe.js
access:
  mode: request-credentials
  how: Email isvinquiries@deluxe.com to request a Client Application (Client ID + Client Secret).
  documented_at: https://docs.deluxe.com/docs/deluxe-payments-platform/zoi9qoo2d5tf2-deluxe-payments-platform
  key_separation: >-
    Deluxe does not use a test-vs-live key PREFIX convention. The environment is selected by host
    (sandbox.api.deluxe.com vs api.deluxe.com) and by which credential pair was issued, not by an
    inspectable key shape. An integrator cannot tell a test credential from a live one by looking at it.
token:
  type: bearer
  lifetime_minutes: 60
  refresh_guidance: Deluxe recommends re-authenticating every 45 minutes.
  reissue_behavior: >-
    "If the Bearer token has not expired, the server will not return a new bearer token." Token
    expiry times must be converted to the caller's local time zone.
