      - Webhooks
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://api.deluxe.com/dpp/v1
    humanURL: https://developer.deluxe.com/api-ref/merchant-services/payments
    properties:
      - url: openapi/deluxe-dpp-gateway-openapi.yml
        type: OpenAPI
      - url: raml/deluxe-dpp-gateway.raml.json
        type: RAML
      - url: overlays/deluxe-dpp-gateway-overlay.yaml
        type: Overlay
      - url: asyncapi/deluxe-webhooks.yml
        type: Webhooks
      - url: https://developer.deluxe.com/api-ref/merchant-services/payments
        type: APIReference
      - url: https://developer.deluxe.com/docs-content/payments/merchant-services/overview
        type: Documentation
    description: >-
      The DPP Gateway Experience API is the core Deluxe Payments Platform contract: 37 operations across
      payments (sale, authorize, complete, cancel, search, batch), EMV card-present processing and device
      management, refunds, subscriptions, payment methods and tokenization, customers and the vault,
      settlement batches, payment links, and webhook event subscription. Secured with an OAuth 2.0 bearer
      token plus a required partnerToken merchant header. Business failures are returned as HTTP 200 with
      a non-zero responseCode rather than a 4xx.
  - aid: deluxe:dpp-reports-api
    name: Deluxe Payments Platform — Reports Experience API
    tags:
      - Payments
      - Reporting
      - Settlement
      - Data Analytics
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://api.deluxe.com/dpp/v1
    humanURL: https://developer.deluxe.com/api-ref/merchant-services/reports
    properties:
      - url: openapi/deluxe-dpp-reports-openapi.yml
        type: OpenAPI
      - url: raml/deluxe-dpp-reports.raml.json
        type: RAML
      - url: overlays/deluxe-dpp-reports-overlay.yaml
        type: Overlay
      - url: https://developer.deluxe.com/api-ref/merchant-services/reports
        type: APIReference
    description: >-
      The DPP Reports Experience API publishes eight read operations over merchant settlement and
      transaction history — credit card and ACH daily settlement, credit card and ACH monthly fee
      statements, and authorized, captured and settled transaction reports — plus a custom report
      endpoint driven by title and date range. Date ranges are MM/DD/YYYY strings and results paginate
      with page and pageSize.
  - aid: deluxe:dpp-invoices-api
    name: Deluxe Payments Platform — Invoice Experience API
    tags:
      - Payments
      - Invoicing
      - Accounts Receivable
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://api.deluxe.com/dpp/v1
    humanURL: https://developer.deluxe.com/api-ref/merchant-services/invoices
    properties:
      - url: openapi/deluxe-dpp-invoices-openapi.yml
        type: OpenAPI
      - url: raml/deluxe-dpp-invoices.raml.json
        type: RAML
      - url: overlays/deluxe-dpp-invoices-overlay.yaml
        type: Overlay
      - url: https://developer.deluxe.com/api-ref/merchant-services/invoices
        type: APIReference
    description: >-
      The DPP Invoice Experience API publishes eleven operations for merchant invoicing — create a draft,
      modify invoice details, modify invoice status, retrieve, search, share, clone and download an
      invoice, plus create, read and modify the merchant's invoice configuration. Invoices carry the same
      customerId and paymentId identifier space as the Gateway Experience API.
  - aid: deluxe:dpp-sandbox-api
    name: Deluxe Payments Platform — Sandbox API (Deluxe-published OpenAPI)
    tags:
      - Payments
      - Sandbox
      - Testing
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://sandbox.api.deluxe.com
    humanURL: https://docs.deluxe.com/docs/deluxe-payments-platform/cc313e0a380f7-deluxe-postman-sandbox
    properties:
      - url: openapi/deluxe-postman-sandbox-openapi.yml
        type: OpenAPI
      - url: overlays/deluxe-postman-sandbox-overlay.yaml
        type: Overlay
      - url: https://docs.deluxe.com/docs/deluxe-payments-platform/cc313e0a380f7-deluxe-postman-sandbox
        type: APIReference
    description: >-
      The only OpenAPI document Deluxe publishes itself — an OpenAPI 3.0.0 definition titled "Deluxe
      Postman-Sandbox", served from Deluxe's own Stoplight workspace and describing the sandbox bearer
      token exchange plus consolidated transaction, report and vault endpoints on
      sandbox.api.deluxe.com. It documents an older, coarser shape of the platform than the 56-operation
      RAML set on developer.deluxe.com, and is saved here verbatim.
